workflows:
  slh_parent_android:
    name: SLH_HAWK Parent 1.0.5
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: flutter pub get
      - name: Create Android platform if missing
        script: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org tn.slh.hawk --project-name parent .
          fi
      - name: Analyze Dart source
        script: flutter analyze --no-pub
      - name: Run tests
        script: flutter test --no-pub
      - name: Build release APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
